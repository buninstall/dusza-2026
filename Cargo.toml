[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/minescript-desktop"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
assert_is_empty = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
