name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "crates/minescript-desktop/**"
  pull_request:
    paths:
      - "crates/minescript-desktop/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  DATABASE_URL: mysql://minescript:minescript@127.0.0.1:3306/minescript
  TEST_DATABASE_URL: mysql://root:minescript@127.0.0.1:3306
  DESKTOP_DIR: crates/minescript-desktop
  LINUX_DESKTOP_DEPS: libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: minescript
          MYSQL_DATABASE: minescript
          MYSQL_USER: minescript
          MYSQL_PASSWORD: minescript
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=minescript --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just release
      - run: just smoke
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  desktop-check:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DESKTOP_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DESKTOP_DIR }} -> target
      - working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  desktop-prepare:
    needs: desktop-check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          base=$(jq -r .version "$DESKTOP_DIR/tauri.conf.json")
          version="${base%.*}.${GITHUB_RUN_NUMBER}"
          tag="desktop-v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          subject=$(git log -1 --format=%s)
          printf 'MineScript Desktop %s\n\nCommit: %s (%s)\n\nmacOS: .dmg (Apple Silicon és Intel), Windows: .msi vagy -setup.exe, Linux: .AppImage, .deb vagy .rpm.\n' "$version" "$subject" "${GITHUB_SHA::7}" > notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --target "$GITHUB_SHA" --title "MineScript Desktop $version" --notes-file notes.md

  desktop-build:
    needs: [desktop-check, desktop-prepare]
    if: >-
      always() && needs.desktop-check.result == 'success' &&
      (needs.desktop-prepare.result == 'success' || needs.desktop-prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-6vcpu-macos-15
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: blacksmith-4vcpu-windows-2025
            args: ""
            rust-targets: ""
          - os: blacksmith-4vcpu-ubuntu-2204
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    env:
      MINESCRIPT_BASE_URL: ${{ vars.MINESCRIPT_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.desktop-prepare.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ needs.desktop-prepare.result == 'success' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DESKTOP_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DESKTOP_DIR }} -> target
          key: ${{ matrix.os }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - working-directory: ${{ env.DESKTOP_DIR }}
        shell: bash
        run: |
          if [ -n "$VERSION" ]; then
            config=$(jq -nc --arg v "$VERSION" '{version: $v, bundle: {createUpdaterArtifacts: true}}')
            bunx @tauri-apps/cli@2.12.4 build --ci ${{ matrix.args }} --config "$config"
          else
            bunx @tauri-apps/cli@2.12.4 build --ci ${{ matrix.args }}
          fi
      - shell: bash
        run: |
          mkdir -p dist
          find "$DESKTOP_DIR/target" -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} dist/ \;
          for file in dist/*' '*; do [ -e "$file" ] && mv "$file" "${file// /-}"; done
          for file in dist/*.app.tar.gz dist/*.app.tar.gz.sig; do
            [ -e "$file" ] && mv "$file" "${file/.app.tar.gz/_${VERSION}_universal.app.tar.gz}"
          done
          ls -la dist
          test -n "$(ls -A dist)"
      - if: needs.desktop-prepare.result == 'success'
        shell: bash
        run: gh release upload "${{ needs.desktop-prepare.outputs.tag }}" dist/* --clobber
      - if: needs.desktop-prepare.result != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: minescript-desktop-${{ runner.os }}
          path: dist/*
          retention-days: 7

  desktop-publish:
    needs: [desktop-prepare, desktop-build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.desktop-prepare.outputs.tag }}
      VERSION: ${{ needs.desktop-prepare.outputs.version }}
    steps:
      - name: latest.json
        run: |
          mkdir sigs && cd sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig'
          entry() {
            local sig; sig=$(ls *"$2".sig 2>/dev/null | head -1)
            if [ -n "$sig" ]; then
              jq -n --arg k "$1" --arg u "${sig%.sig}" --rawfile s "$sig" '{($k): {url: $u, signature: $s}}'
            fi
          }
          {
            for arch in aarch64 x86_64; do
              entry "darwin-$arch-app" .app.tar.gz
              entry "darwin-$arch" .app.tar.gz
            done
            entry windows-x86_64-nsis -setup.exe
            entry windows-x86_64-msi .msi
            entry windows-x86_64 -setup.exe
            entry linux-x86_64-appimage .AppImage
            entry linux-x86_64-deb .deb
            entry linux-x86_64-rpm .rpm
            entry linux-x86_64 .AppImage
          } | jq -s --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, pub_date: $d, notes: "MineScript Desktop \($v)", platforms: add}' > ../latest.json
          test "$(jq '.platforms | length' ../latest.json)" -gt 0
          cd .. && cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
      - run: gh release edit "${{ needs.desktop-prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
