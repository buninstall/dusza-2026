name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just release
      - run: just smoke
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
