name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DATABASE_URL: mysql://minescript:minescript@127.0.0.1:3306/minescript
  TEST_DATABASE_URL: mysql://root:minescript@127.0.0.1:3306

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: minescript
          MYSQL_DATABASE: minescript
          MYSQL_USER: minescript
          MYSQL_PASSWORD: minescript
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=minescript --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just release
      - run: just smoke
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
