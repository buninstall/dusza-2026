name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql://minescript:minescript@127.0.0.1:3306/minescript
  TEST_DATABASE_URL: mysql://root:minescript@127.0.0.1:3306

jobs:
  rust:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: just types
      - run: git diff --exit-code packages/engine/src/generated

  web:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: minescript
          MYSQL_DATABASE: minescript
          MYSQL_USER: minescript
          MYSQL_PASSWORD: minescript
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=minescript --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just wasm
      - run: bunx biome ci .
      - run: bun run --filter '*' typecheck
      - run: bun run --filter '*' test
      - run: just build

  e2e:
    needs: web
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: minescript
          MYSQL_DATABASE: minescript
          MYSQL_USER: minescript
          MYSQL_PASSWORD: minescript
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=minescript --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
        working-directory: e2e
      - run: just e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report

  conformance:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just wasm
      - run: just conformance

  binaries:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [rust, web]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: minescript
          MYSQL_DATABASE: minescript
          MYSQL_USER: minescript
          MYSQL_PASSWORD: minescript
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=minescript --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just release
      - run: just smoke
      - uses: actions/upload-artifact@v4
        with:
          name: minescript-binaries
          path: release/
          if-no-files-found: error
