<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5">
  <title>MineScript – frissítés folyamatban</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14110f; color: #f3e9d2;
           font: 16px/1.6 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    main { max-width: 34rem; padding: 2rem; border: 4px solid #f3b33d; box-shadow: 8px 8px 0 #000; background: #1f1a16; }
    h1 { margin: 0 0 .75rem; font-size: 1.4rem; color: #f3b33d; }
    p { margin: 0 0 .5rem; }
  </style>
</head>
<body>
  <main>
    <h1>A bánya épp frissül</h1>
    <p>Az új verzió néhány másodpercen belül elindul.</p>
    <p>Az oldal magától újratöltődik.</p>
  </main>
</body>
</html>
