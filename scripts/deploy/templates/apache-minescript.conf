<VirtualHost *:80>
    ServerName @DOMAIN@
    ServerAdmin webmaster@localhost
    DocumentRoot /srv/minescript/www

    ErrorLog ${APACHE_LOG_DIR}/minescript-error.log
    CustomLog ${APACHE_LOG_DIR}/minescript-access.log combined
    LogLevel warn

    <Directory /srv/minescript/www>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    IncludeOptional /etc/apache2/minescript/gate.conf

    <LocationMatch "^/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    ProxyVia Off
    ProxyTimeout 60

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset Authorization
    RequestHeader unset Proxy

    Alias /_minescript/ /srv/minescript/www/
    ProxyPass /_minescript/ !
    ProxyPass / http://127.0.0.1:8080/ connectiontimeout=3 timeout=60 retry=0 keepalive=On
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorDocument 502 /_minescript/karbantartas.html
    ErrorDocument 503 /_minescript/karbantartas.html
    ErrorDocument 504 /_minescript/karbantartas.html

    Header always unset X-Powered-By
    Header always setifempty X-Content-Type-Options "nosniff"
    Header always setifempty X-Frame-Options "DENY"
    Header always setifempty Referrer-Policy "strict-origin-when-cross-origin"
    Header always setifempty Strict-Transport-Security "max-age=31536000"
    Header always setifempty Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always setifempty Cross-Origin-Opener-Policy "same-origin"
    Header always set X-Robots-Tag "noindex, nofollow"

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/wasm application/manifest+json image/svg+xml
    </IfModule>
</VirtualHost>
