ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
Timeout 60
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 500
LimitRequestBody 2097152
LimitRequestFields 100
LimitRequestFieldSize 16384
LimitRequestLine 8190

<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

<DirectoryMatch "/\.(?!well-known)">
    Require all denied
</DirectoryMatch>

<FilesMatch "(?i)\.(bak|old|orig|swp|sql|gz|env|ini|log|sh|conf)$">
    Require all denied
</FilesMatch>
