[package]
name = "minescript-desktop"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
cookie_store = "0.22.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies", "gzip", "brotli"] }
reqwest_cookie_store = "0.10.0"
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
url = "2.5.8"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
url = "2.5.8"
