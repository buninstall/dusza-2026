<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <title>MineScript DMG háttér</title>
    <style>
      @font-face {
        font-family: "Mono";
        src: url("../../../apps/web/node_modules/@fontsource-variable/atkinson-hyperlegible-mono/files/atkinson-hyperlegible-mono-latin-wght-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF;
        font-weight: 200 800;
      }
      @font-face {
        font-family: "Mono";
        src: url("../../../apps/web/node_modules/@fontsource-variable/atkinson-hyperlegible-mono/files/atkinson-hyperlegible-mono-latin-ext-wght-normal.woff2") format("woff2");
        unicode-range: U+0100-024F;
        font-weight: 200 800;
      }
      html,
      body {
        margin: 0;
        width: 660px;
        height: 400px;
        overflow: hidden;
        background: #110f0d;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 660px;
        height: 400px;
        image-rendering: pixelated;
      }
      .title {
        position: absolute;
        top: 34px;
        left: 0;
        right: 0;
        text-align: center;
        font: 700 30px/1 "Mono", ui-monospace, monospace;
        letter-spacing: 0.16em;
        color: #f1e7d3;
        text-shadow:
          3px 3px 0 #070605,
          0 0 18px rgb(242 181 58 / 0.25);
      }
      .title b {
        color: #f2b53a;
        font-weight: 700;
      }
      .sub {
        position: absolute;
        top: 74px;
        left: 0;
        right: 0;
        text-align: center;
        font: 600 11px/1 "Mono", ui-monospace, monospace;
        letter-spacing: 0.5em;
        color: #988a76;
        text-indent: 0.5em;
      }
      .hint {
        position: absolute;
        top: 322px;
        left: 0;
        right: 0;
        text-align: center;
        font: 500 13px/1 "Mono", ui-monospace, monospace;
        letter-spacing: 0.02em;
        color: #bcae98;
      }
      .hint b {
        color: #f2b53a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="660" height="400"></canvas>
    <div class="title">MINE<b>SCRIPT</b></div>
    <div class="sub">DESKTOP</div>
    <div class="hint">Húzd a robotot az <b>Alkalmazások</b> mappába</div>
    <script>
      const P = 4;
      const W = 660 / P;
      const H = 400 / P;
      const ctx = document.getElementById("c").getContext("2d");
      let seed = 1337;
      const rnd = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      const px = (x, y, c) => {
        ctx.fillStyle = c;
        ctx.fillRect(x * P, y * P, P, P);
      };
      const rect = (x, y, w, h, c) => {
        ctx.fillStyle = c;
        ctx.fillRect(x * P, y * P, w * P, h * P);
      };
      const lamps = [
        [170 / P, 190 / P],
        [490 / P, 190 / P],
      ];
      const glowAt = (x, y) => {
        let g = 0;
        for (const [lx, ly] of lamps) {
          const d = Math.hypot(x + 0.5 - lx, (y + 0.5 - ly) * 1.15);
          g = Math.max(g, 1 - d / 34);
        }
        return Math.max(0, g);
      };
      const stone = ["#0c0a09", "#110f0d", "#110f0d", "#15120f", "#15120f", "#1b1714"];
      const lit = ["#1a140e", "#21190f", "#291e11", "#332413"];
      for (let by = 0; by < H; by += 2) {
        for (let bx = 0; bx < W; bx += 2) {
          const base = stone[Math.floor(rnd() * stone.length)];
          for (let y = by; y < by + 2; y++) {
            for (let x = bx; x < bx + 2; x++) {
              let c = base;
              if (rnd() < 0.12) c = stone[Math.floor(rnd() * stone.length)];
              const g = glowAt(x, y);
              const step = Math.floor(g * 4.999);
              if (step > 0) {
                const jitter = rnd() < 0.18 ? -1 : 0;
                const s = Math.max(0, Math.min(lit.length - 1, step - 1 + jitter));
                c = lit[s];
              }
              px(x, y, c);
            }
          }
        }
      }
      const vignette = (x, y) => {
        const dx = (x + 0.5) / W - 0.5;
        const dy = (y + 0.5) / H - 0.5;
        return Math.hypot(dx * 1.1, dy * 1.4);
      };
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const v = vignette(x, y);
          if (v > 0.58 || (v > 0.5 && (x + y) % 2 === 0)) {
            ctx.fillStyle = "rgb(7 6 5 / 0.55)";
            ctx.fillRect(x * P, y * P, P, P);
          }
        }
      }
      const blocked = (x, y) => {
        if (x > 30 && x < 135 && y > 5 && y < 26) return true;
        if (glowAt(x, y) > 0.05) return true;
        if (x > 58 && x < 107 && y > 38 && y < 58) return true;
        return y > 74 && y < 90 && x > 20 && x < 145;
      };
      const ore = [
        [0, 0, "#f2b53a"],
        [1, 0, "#ffe58a"],
        [0, 1, "#b8741b"],
        [1, 1, "#f2b53a"],
        [2, 1, "#4a2c08"],
        [1, 2, "#b8741b"],
      ];
      const gem = [
        [0, 0, "#97cc6e"],
        [1, 0, "#d6f5b8"],
        [0, 1, "#4f7f30"],
        [1, 1, "#97cc6e"],
      ];
      let placed = 0;
      let tries = 0;
      while (placed < 15 && tries < 4000) {
        tries++;
        const x = 3 + Math.floor(rnd() * (W - 7));
        const y = 4 + Math.floor(rnd() * (H - 9));
        let ok = true;
        for (let dy = -2; dy < 5 && ok; dy++) for (let dx = -2; dx < 5 && ok; dx++) if (blocked(x + dx, y + dy)) ok = false;
        if (!ok) continue;
        const shape = placed % 5 === 4 ? gem : ore;
        const dim = vignette(x, y) > 0.5;
        for (const [dx, dy, c] of shape) {
          px(x + dx, y + dy, c);
          if (dim) {
            ctx.fillStyle = "rgb(7 6 5 / 0.45)";
            ctx.fillRect((x + dx) * P, (y + dy) * P, P, P);
          }
        }
        placed++;
      }
      const hazard = (y0) => {
        for (let x = 0; x < W; x++) {
          for (let y = 0; y < 2; y++) {
            px(x, y0 + y, Math.floor((x + y) / 3) % 2 === 0 ? "#f2c21b" : "#15120f");
          }
        }
        rect(0, y0 === 0 ? 2 : y0 - 1, W, 1, "#070605");
      };
      const sign = (cx) => {
        const w = 56;
        const x = Math.round(cx / P - w / 2);
        const y = 65;
        const h = 7;
        rect(x + 3, y - 2, 1, 2, "#4a2c08");
        rect(x + w - 4, y - 2, 1, 2, "#4a2c08");
        rect(x + 1, y + h, w, 1, "#070605");
        rect(x, y, w, h, "#2a1a08");
        rect(x + 1, y + 1, w - 2, h - 2, "#e9dcbf");
        rect(x + 1, y + 1, w - 2, 1, "#f8efdc");
        rect(x + 1, y + h - 2, w - 2, 1, "#c9b58f");
        px(x, y, "#110f0d");
        px(x + w - 1, y, "#110f0d");
        px(x, y + h - 1, "#110f0d");
        px(x + w - 1, y + h - 1, "#110f0d");
        px(x + 2, y + 3, "#7d6e5e");
        px(x + w - 3, y + 3, "#7d6e5e");
      };
      sign(170);
      sign(490);
      hazard(0);
      hazard(H - 2);
      const rx0 = 65;
      const rx1 = 99;
      const ry = 49;
      for (let x = rx0; x <= rx1; x += 3) {
        rect(x, ry - 1, 2, 5, "#4a2c08");
        px(x, ry - 1, "#6b3f12");
      }
      rect(rx0 - 1, ry, rx1 - rx0 + 3, 1, "#a3adb5");
      rect(rx0 - 1, ry + 1, rx1 - rx0 + 3, 1, "#6b7681");
      rect(rx0 - 1, ry + 3, rx1 - rx0 + 3, 1, "#a3adb5");
      rect(rx0 - 1, ry + 4, rx1 - rx0 + 3, 1, "#6b7681");
      const ax = rx1 + 3;
      const arrow = [
        [0, -3],
        [0, -2],
        [1, -2],
        [0, -1],
        [1, -1],
        [2, -1],
        [0, 0],
        [1, 0],
        [2, 0],
        [3, 0],
        [0, 1],
        [1, 1],
        [2, 1],
        [3, 1],
        [0, 2],
        [1, 2],
        [2, 2],
        [0, 3],
        [1, 3],
        [0, 4],
      ];
      for (const [dx, dy] of arrow) px(ax + dx, ry + dy, "#f2b53a");
      px(ax, ry - 3, "#ffe58a");
      px(ax, ry - 2, "#ffe58a");
      for (const [dx, dy] of arrow) if (dx === 0 && dy > 1) px(ax + dx, ry + dy, "#b8741b");
      const cx = 76;
      const cy = ry - 8;
      rect(cx + 1, cy + 1, 3, 2, "#f2b53a");
      px(cx + 2, cy, "#ffe58a");
      rect(cx + 5, cy + 1, 3, 2, "#b8741b");
      px(cx + 6, cy, "#f2b53a");
      rect(cx + 4, cy, 1, 2, "#fff7cf");
      rect(cx, cy + 3, 9, 1, "#7d6e5e");
      rect(cx, cy + 4, 9, 3, "#3b332b");
      rect(cx + 1, cy + 5, 7, 1, "#4a4038");
      rect(cx, cy + 4, 1, 3, "#7d6e5e");
      rect(cx + 8, cy + 4, 1, 3, "#241e19");
      rect(cx + 1, cy + 7, 7, 1, "#241e19");
      rect(cx + 1, cy + 8, 2, 1, "#15181b");
      rect(cx + 6, cy + 8, 2, 1, "#15181b");
      px(cx + 1, cy + 8, "#6b7681");
      px(cx + 6, cy + 8, "#6b7681");
      for (let i = 0; i < 3; i++) {
        px(cx - 3 - i * 2, cy + 5, i === 0 ? "#7d6e5e" : "#3b332b");
      }
    </script>
  </body>
</html>
